[pytest]
# Pytest configuration for ball drop simulation tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Test directories
testpaths = tests

# Command line options
addopts = 
    -v
    --tb=short
    --strict-markers
    -ra

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    physics: marks tests related to physics calculations
    simulation: marks tests related to simulation core
    reporting: marks tests related to reporting/output

# Minimum pytest version
minversion = 7.0

# Filter warnings
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Logging configuration
log_cli = false
log_cli_level = INFO

# Coverage options (when using pytest-cov)
# [coverage:run]
# source = .
# omit = tests/*, */__pycache__/*

# [coverage:report]
# exclude_lines =
#     pragma: no cover
#     def __repr__
#     raise AssertionError
#     raise NotImplementedError